[package]
name = "common"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# Application crates pin this crate by Git revision. It stays unpublished so
# registry versions cannot become a second distribution channel for shared
# code.
publish = false
description = "The components every Tectonic command and the bootc installer share"

[features]
fuzzing = []
test-support = []

[dependencies]
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = "1.0.228"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# lint.sh runs clippy with -D warnings, so a lint set to warn here also
# fails lint.sh.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
